[package]
name = "swmm-studio"
description = "SWMM Studio desktop application (Tauri shell)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "swmm-studio"
path = "src/main.rs"

[features]
# Serves the built front-end (app/ui/dist) from the binary, so that a plain
# `cargo build --release` makes a working app. `cargo tauri dev` turns it off to use
# the Vite dev server instead.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
swmm-inp.workspace = true
swmm-out.workspace = true
swmm-rpt.workspace = true
swmm-geo.workspace = true
swmm-model.workspace = true
swmm-engine.workspace = true
swmm-analysis.workspace = true
rayon.workspace = true
rust_xlsxwriter = "0.101"
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile.workspace = true
