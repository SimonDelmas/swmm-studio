name: Release

# A pushed `vX.Y.Z` tag builds the Windows installers and attaches them to a draft GitHub release.
on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # The tag must match the workspace version (Cargo.toml), which the installers are named after.
      - name: Check tag against version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "swmm-studio") | .version')
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the workspace version ${version}"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - run: npm ci
        working-directory: app/ui
      - run: npm install --global @tauri-apps/cli@2
      - run: tauri build
        working-directory: app/src-tauri
      # A draft, to be reviewed and published by hand; a `-` in the tag (v1.0.0-1) marks a pre-release.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--draft --generate-notes --verify-tag --title "SWMM Studio ${GITHUB_REF_NAME}")
          [[ "${GITHUB_REF_NAME}" == *-* ]] && flags+=(--prerelease)
          gh release create "${GITHUB_REF_NAME}" "${flags[@]}" \
            target/release/bundle/msi/*.msi \
            target/release/bundle/nsis/*.exe
