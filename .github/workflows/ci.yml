name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      # The Tauri crate embeds the built front-end, so it is built first.
      - run: npm ci
        working-directory: app/ui
      - run: npm run build
        working-directory: app/ui
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Tests that need a SWMM engine (SWMM_ENGINE) or a model corpus (SWMM_INP_CORPUS) are skipped.
      - run: cargo test --workspace

  installer:
    # Windows installers (MSI, NSIS) of the desktop app, on pushes to main.
    if: github.event_name == 'push'
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - run: npm ci
        working-directory: app/ui
      - run: npm install --global @tauri-apps/cli@2
      - run: tauri build
        working-directory: app/src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: swmm-studio-windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
